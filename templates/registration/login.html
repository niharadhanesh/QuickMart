{% extends 'base.html' %}
{% block title %}Login | QuickMart{% endblock %}
{% block content %}
<div class="auth-box">
  <h2>Login</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Login</button>
  </form>
  <p>New here? <a href="{% url 'signup' %}">Create an account</a></p>
</div>
{% endblock %}
